<div class="min-h-screen bg-slate-900 text-white flex flex-col justify-between p-4 sm:p-6 select-none font-sans">

  <!-- Header sutil -->
  <header class="w-full max-w-xl mx-auto flex items-center justify-center py-4 border-b border-slate-800">
    <a routerLink="/" class="flex items-center gap-2">
      <span class="text-2xl">💍</span>
      <span class="font-black tracking-widest uppercase text-base sm:text-lg text-slate-200">Boda Trivia</span>
    </a>
  </header>

  <!-- Formulario de Código -->
  <main class="w-full max-w-md mx-auto my-auto py-8">
    <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-6 sm:p-8 text-center shadow-2xl backdrop-blur-sm">
      <div class="text-5xl mb-4">🎟️</div>
      <h1 class="text-2xl sm:text-3xl font-black mb-2 text-white">¡Bienvenidos!</h1>
      <p class="text-slate-300 text-sm leading-relaxed mb-6">
        Ingresá el código alfanumérico que figura debajo del QR en tu tarjeta para comenzar a jugar.
      </p>

      <form (ngSubmit)="submitCode()" class="space-y-4">
        <div>
          <input
            type="text"
            [(ngModel)]="code"
            name="guestCode"
            placeholder="Ej: 2c9c2895"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            class="w-full text-center tracking-widest text-lg font-mono uppercase px-4 py-3.5 bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 transition text-white placeholder:text-slate-600 shadow-inner"
          />
        </div>

        @if (errorMessage()) {
          <p class="text-rose-400 text-xs sm:text-sm font-semibold animate-pulse">
            {{ errorMessage() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="isLoading() || !code().trim()"
          class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 active:scale-[0.98] font-black text-base uppercase tracking-wider rounded-xl shadow-lg shadow-indigo-600/30 transition cursor-pointer flex items-center justify-center gap-2">
          @if (isLoading()) {
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            <span>Verificando...</span>
          } @else {
            <span>Ingresar a la Trivia</span>
          }
        </button>
      </form>

      <!-- Accesos Rápidos: Leaderboard & Stats -->
      <div class="mt-6 pt-6 border-t border-slate-700/60 flex justify-center">
  <a
    routerLink="/admin"
    class="w-full py-2.5 px-4 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 tracking-wider uppercase transition flex items-center justify-center gap-2 active:scale-95 text-center">
    <span>🔒</span>
    <span>Panel de Control (Admin)</span>
  </a>
</div>

    </div>
  </main>

  <footer class="w-full max-w-xl mx-auto text-center py-4 text-xs text-slate-500">
    ¡Gracias por compartir esta noche con nosotros!
  </footer>
</div>
